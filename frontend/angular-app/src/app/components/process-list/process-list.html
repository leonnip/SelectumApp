<h2>Procesos</h2>

<ul>
    @for (p of processes; track p.id) {
        <li>
            {{p.step_order}} - {{p.name}}
        </li>
    }
</ul>

<hr>

<h2>Historial Blockchain</h2>

<ul>
    @for (h of history; track h.id) {
        <li>
            {{h.hash}} → prev: {{h.previous_hash}}
        </li>
    }
</ul>
